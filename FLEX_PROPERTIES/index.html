<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Properties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flexbox</h1>
    <p>Flexbox is a one-dimensional layout model that makes it easy to align items in rows or columns. It consists of a Flex Container(the parent) and Flex Items(the children).</p>
    <div class="parent">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item" id="alignSelf">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item" id="order">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
    </div>
</body>
</html>
