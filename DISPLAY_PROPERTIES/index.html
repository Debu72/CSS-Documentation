<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="inline">This is an inline element</div>
    <span class="block">This is a block element</span>
    <div class="inline-block">This is an inline-block element</div>
    <div class="none">This is a display: none element</div>
    <div class="hidden">This is a visibility: hidden element</div>
    This is a flex element
    <div class="flex">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    This is a grid element
    <div class="grid">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>

</html>
